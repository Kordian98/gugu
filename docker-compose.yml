# GuGu local stack — localhost only (X16). Owner: platform-devops (first version by backend-database, 04-S1).
# Start: `pnpm stack:up` · stop: `pnpm stack:down` · wipe data: `pnpm stack:reset`.
# Host ports use a GuGu range (15432, 16379, 19000…) so the stack runs next to other local projects;
# override any of them in .env.
name: gugu

services:
  postgres:
    # Matches the later target (RDS PostgreSQL 18 + PostGIS 3.6), docs/tasks/04-backend-database.md §3.8.
    # Built locally: postgis/postgis:18-3.6 has no arm64 image (see infra/docker/postgres/Dockerfile).
    build: ./infra/docker/postgres
    image: gugu/postgres:18.6-postgis-3.6.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gugu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gugu}
      POSTGRES_DB: ${POSTGRES_DB:-gugu}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    # Redis-protocol compatible; BullMQ and ioredis work unchanged.
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--databases", "64"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # S3 emulator. MinIO no longer publishes community images on Docker Hub; Chainguard's free
    # image only offers :latest. Replace with a pinned digest once platform-devops picks a source.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-gugu}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-gugu-local-secret}
      MC_HOST_local: http://${S3_ACCESS_KEY_ID:-gugu}:${S3_SECRET_ACCESS_KEY:-gugu-local-secret}@localhost:9000
    ports:
      - "127.0.0.1:${MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY_ID:-gugu}:${S3_SECRET_ACCESS_KEY:-gugu-local-secret}@minio:9000
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:-gugu-media}"]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  valkey-data:
  minio-data:
