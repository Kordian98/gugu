packages:
  - apps/*
  - packages/*

# Native/build-script dependencies allowed to run install scripts (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - lightningcss
  - unrs-resolver

# NativeWind v5 rc requires an exact lightningcss (see ADR-0004).
overrides:
  lightningcss: 1.30.1

autoInstallPeers: true
